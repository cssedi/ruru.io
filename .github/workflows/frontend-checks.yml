name: Frontend checks

on:
  pull_request:
    paths:
      - 'frontend/ruru-frontend/**'
      - '.github/workflows/frontend-checks.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/ruru-frontend/**'
      - '.github/workflows/frontend-checks.yml'

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: frontend/ruru-frontend
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/ruru-frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: |
          set -o pipefail
          npx tsc -b 2>&1 | tee typecheck.log

      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          npx eslint src 2>&1 | tee lint.log

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          npx vite build 2>&1 | tee build.log

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const dir = 'frontend/ruru-frontend'
            const read = (f) => (fs.existsSync(`${dir}/${f}`) ? fs.readFileSync(`${dir}/${f}`, 'utf8').trim() : '')
            const steps = ${{ toJSON(steps) }}
            let body = '### Frontend checks\n\n| Step | Result |\n| --- | --- |\n'
            for (const [name, id] of [['Typecheck', 'typecheck'], ['Lint', 'lint'], ['Build', 'build']]) {
              body += `| ${name} | ${steps[id]?.outcome ?? 'skipped'} |\n`
            }
            for (const [name, file, id] of [['Typecheck', 'typecheck.log', 'typecheck'], ['Lint', 'lint.log', 'lint'], ['Build', 'build.log', 'build']]) {
              if (steps[id]?.outcome === 'failure') body += `\n**${name} output**\n\`\`\`\n${read(file).slice(-6000)}\n\`\`\`\n`
            }
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body })

      - name: Fail if any check failed
        if: steps.typecheck.outcome != 'success' || steps.lint.outcome != 'success' || steps.build.outcome != 'success'
        run: exit 1
