name: Backend tests

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet build backend/ruru-api.Tests 2>&1 | tee build.log

      - name: Test
        id: test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet test backend/ruru-api.Tests --no-build --logger "console;verbosity=normal" 2>&1 | tee test.log

      - name: Check every model change has a migration
        id: migrations
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet tool install --global dotnet-ef --version 10.0.12
          dotnet ef migrations has-pending-model-changes --project backend/ruru-api 2>&1 | tee migrations.log

      # TEMPORARY: generates the missing AddUserProfileAndConsent migration and posts it on the PR
      # so it can be committed. Remove once the migration is in the repo.
      - name: Generate missing migration (temporary)
        if: steps.migrations.outcome == 'failure' && github.event_name == 'pull_request'
        shell: bash
        run: |
          mkdir -p comments
          dotnet ef migrations add AddUserProfileAndConsent --project backend/ruru-api --output-dir Migrations
          n=2
          for f in $(git ls-files --others --exclude-standard backend/ruru-api/Migrations) backend/ruru-api/Migrations/RuruDBContextModelSnapshot.cs; do
            { echo "MIGRATION-FILE: $f"; echo '```csharp'; cat "$f"; echo '```'; } > "comments/$n-file.md"
            n=$((n+1))
          done

      - name: Write PR comment
        if: always() && github.event_name == 'pull_request'
        shell: bash
        run: |
          mkdir -p comments
          {
            echo "### Backend tests"
            echo
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| Build | ${{ steps.build.outcome }} |"
            echo "| Tests | ${{ steps.test.outcome }} |"
            echo "| Migrations up to date | ${{ steps.migrations.outcome }} |"
            echo
            if [ "${{ steps.build.outcome }}" != "success" ]; then
              echo "**Build errors**"
              echo '```'
              grep -E "error [A-Z]+[0-9]+" build.log | sed 's#.*/backend/#backend/#' | sort -u | head -60
              echo '```'
            fi
            if [ -f test.log ]; then
              echo "**Test output (failures and summary)**"
              echo '```'
              grep -E "^\s+(Failed|Error Message|Assert|Expected|Actual|Stack Trace)|^\s+at ruru_api|Passed!|Failed!|Total tests|Failed ruru_api" test.log | head -150
              echo '```'
            fi
            if [ -f migrations.log ]; then
              echo "**Migrations check**"
              echo '```'
              tail -5 migrations.log
              echo '```'
            fi
          } > comments/1-summary.md

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            for (const file of fs.readdirSync('comments').sort()) {
              const body = fs.readFileSync(`comments/${file}`, 'utf8').slice(0, 65000)
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body })
            }

      - name: Fail if build, tests or migrations check failed
        if: steps.build.outcome != 'success' || steps.test.outcome != 'success' || steps.migrations.outcome != 'success'
        run: exit 1
